<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  
  <!-- CPU chip -->
  <rect x="50" y="50" width="100" height="100" rx="8" fill="none" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Grid pattern -->
  <rect x="60" y="60" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="90" y="60" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="120" y="60" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  
  <rect x="60" y="90" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="90" y="90" width="20" height="20" fill="#22c55e" opacity="0.3"/>
  <rect x="120" y="90" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  
  <rect x="60" y="120" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="90" y="120" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="120" y="120" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  
  <!-- Connection lines -->
  <circle cx="70" cy="50" r="3" fill="#22c55e"/>
  <circle cx="130" cy="50" r="3" fill="#22c55e"/>
  <circle cx="50" cy="70" r="3" fill="#22c55e"/>
  <circle cx="150" cy="70" r="3" fill="#22c55e"/>
  <circle cx="50" cy="130" r="3" fill="#22c55e"/>
  <circle cx="150" cy="130" r="3" fill="#22c55e"/>
  <circle cx="70" cy="150" r="3" fill="#22c55e"/>
  <circle cx="130" cy="150" r="3" fill="#22c55e"/>
</svg>